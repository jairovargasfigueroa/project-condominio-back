version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
      - python manage.py collectstatic --noinput
run:
  runtime-version: 3.12
  command: python manage.py runserver 0.0.0.0:8000
  network:
    port: 8000
    env:
      PORT: 8000
  env:
    - name: PYTHONUNBUFFERED
      value: "1"